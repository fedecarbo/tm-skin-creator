<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lab</title>
<link rel="icon" href="data:,">
<style>
  /* The Lab, where a car gets designed with Claude: the Studio (the build, step by step), the
     painting rooms (Body, Details, Tyres, Glass, the game's maps: tool/rooms.py, each the car with
     a camera on its area and its own flat map) and the materials, each thing with a line to copy and paste
     to Claude. The viewer's look (index.html): Teko, slanted buttons, one yellow-green accent.
     Each room is a .room whose parts fill the page's three columns. The layouts are the user's
     (CHECKLIST.md, "The Lab"): the Studio B, the materials room A of round 2, and the painting
     rooms as described on 2026-09-26 ("a camera more focused to e.g wheels, each having their uv
     map as a different view ... just like a tab"). */
  @font-face { font-family: Teko; src: url("lib/fonts/Teko-Variable.ttf") format("truetype"); font-weight: 300 700; font-display: block; }
  :root { --ground: #0d0f12; --text: #f2f4f7; --acc: #e8ff47; --ball: #050506; --rail: 250px; --spec: 340px; }
  html, body { margin: 0; height: 100%; background: var(--ground); }
  body { font: 14px/1.35 "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--text); overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
           text-transform: inherit; letter-spacing: inherit; line-height: inherit; }
  a { color: inherit; }
  .ic { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .teko { font-family: Teko, Bahnschrift, "DIN Condensed", sans-serif; text-transform: uppercase; letter-spacing: 0.03em; line-height: 1; }
  .sk { display: flex; align-items: center; gap: 7px; padding: 8px 14px 5px; font-size: 20px; background: rgba(255, 255, 255, 0.08);
        transform: skewX(-12deg); transition: background 0.12s, color 0.12s; white-space: nowrap; text-decoration: none; }
  .sk > * { transform: skewX(12deg); }
  .sk .ic { font-size: 16px; margin-top: -3px; }
  .sk:hover { background: rgba(255, 255, 255, 0.16); }
  .sk[aria-pressed="true"] { background: var(--text); color: var(--ground); }
  .sk[aria-disabled="true"] { opacity: 0.35; cursor: default; }
  .sk[aria-disabled="true"]:hover { background: rgba(255, 255, 255, 0.08); }
  .sk.acc { background: var(--acc); color: var(--ground); font-weight: 600; }
  .sk.acc:hover { background: #f1ff8a; }

  #page { display: grid; grid-template-columns: var(--rail) 1fr var(--spec); grid-template-rows: 92px 1fr; height: 100%; column-gap: 8px; }
  .room { display: contents; }
  .room[hidden] { display: none; }

  /* The Lab's name and its rooms */
  #labTop { grid-column: 1 / -1; display: flex; align-items: center; gap: 26px; padding: 0 40px 0 34px; }
  #labName { margin: 0; font-size: 54px; font-weight: 600; transform: skewX(-9deg); padding-top: 8px; }
  #rooms { display: flex; gap: 6px; }
  #labTop .grow { flex: 1; }

  /* The families, or the maps */
  .rail { grid-column: 1; grid-row: 2; padding: 14px 44px 0 24px; background: rgba(8, 9, 12, 0.9); clip-path: polygon(0 0, 100% 0, calc(100% - 30px) 100%, 0 100%);
          overflow-y: auto; scrollbar-width: none; }
  .rail h2 { margin: 0 0 12px 6px; font-size: 28px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
  .rail h2 span { font-size: 20px; opacity: 0.5; font-weight: 400; }
  .item { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; padding: 6px 10px 3px;
          margin-bottom: 3px; transform: skewX(-10deg); }
  .item > * { transform: skewX(10deg); }
  .item .n { font-size: 21px; font-weight: 500; }
  .item .cnt { font-size: 17px; opacity: 0.5; }
  .item:hover { background: rgba(255, 255, 255, 0.07); }
  .item[aria-current="true"] { background: rgba(232, 255, 71, 0.13); box-shadow: inset 4px 0 var(--acc); }

  /* The shelf: the open family's balls */
  .shelf { grid-column: 2; grid-row: 2; overflow-y: auto; padding: 4px 4px 70px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.2) transparent; }
  .shelfHead { display: flex; align-items: baseline; gap: 12px; margin: 4px 0 10px 4px; }
  .shelfHead h3 { margin: 0; font-size: 34px; font-weight: 600; transform: skewX(-9deg); }
  .shelfHead > span { opacity: 0.55; font-size: 13px; }
  #tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
  .tile { position: relative; display: flex; flex-direction: column; text-align: left; padding: 0 0 7px; background: var(--ball); cursor: pointer; }
  .tile:hover { background: #111318; }
  .tile[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--acc); }
  .tile .pic { width: 100%; aspect-ratio: 1; display: block; background: var(--ball); }
  .tile .code { position: absolute; left: 7px; top: 6px; font-size: 16px; opacity: 0.55; }
  .tile .tn { font-size: 18px; padding: 3px 8px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .tv { font-size: 11px; opacity: 0.55; padding: 1px 6px 0; white-space: nowrap; }
  .tile em { font-style: normal; display: inline-block; font-size: 13px; padding: 2px 5px 0; margin-left: 3px; background: var(--acc);
             color: var(--ground); transform: skewX(-12deg); vertical-align: 1px; }
  .tile .code:has(em) { opacity: 1; color: rgba(242, 244, 247, 0.55); }
  .copyBtn { position: absolute; right: 5px; top: 5px; width: 28px; height: 28px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.1); }
  .copyBtn:hover { background: rgba(255, 255, 255, 0.22); }
  .copyBtn .ic { font-size: 15px; }
  .copyBtn.done { background: var(--acc); color: var(--ground); }

  /* The picked material, or part */
  .spec { grid-column: 3; grid-row: 2; margin: 4px 40px 16px 0; padding: 0 16px 14px; background: var(--ball); overflow-y: auto; scrollbar-width: none; }
  #big { display: block; width: 220px; height: 220px; margin: 0 auto -4px; cursor: grab; touch-action: none; }
  .specName { margin: 0 0 6px; font-size: 44px; font-weight: 600; transform: skewX(-9deg); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .specName small { font-size: 22px; opacity: 0.55; font-weight: 500; }
  .meters { display: flex; flex-direction: column; gap: 7px; margin: 4px 0 10px; }
  .mk { display: flex; justify-content: space-between; font-size: 20px; margin-bottom: 4px; }
  .mk b { font-weight: 500; font-variant-numeric: tabular-nums; }
  .track { display: block; height: 6px; background: rgba(255, 255, 255, 0.12); }
  .track i { display: block; height: 100%; background: var(--text); }
  .row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-top: 1px solid rgba(255, 255, 255, 0.08); font-size: 13px; }
  .row[hidden] { display: none; }
  .row .lab { opacity: 0.55; width: 72px; flex: none; font-size: 12px; padding-top: 1px; }
  .chip { display: inline-block; width: 14px; height: 14px; border-radius: 2px; margin-right: 6px; vertical-align: -2px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2); }
  #about { font-size: 12.5px; opacity: 0.7; }
  .copyWide { width: 100%; justify-content: center; font-size: 22px; padding: 10px 14px 7px; margin-top: 12px; box-sizing: border-box; }
  .copyWide .ic { font-size: 17px; }
  .preview { margin-top: 8px; padding: 8px 10px; background: rgba(255, 255, 255, 0.06); font-size: 12.5px; line-height: 1.45;
             color: rgba(242, 244, 247, 0.85); user-select: all; }

  #toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; z-index: 5;
           display: flex; align-items: baseline; gap: 10px; max-width: calc(100vw - 32px); box-sizing: border-box;
           background: rgba(12, 14, 18, 0.94); backdrop-filter: blur(6px); padding: 9px 16px 8px; box-shadow: inset 4px 0 var(--acc);
           font-size: 13.5px; transition: opacity 0.15s, transform 0.15s; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #toast b { font-size: 20px; font-weight: 600; color: var(--acc); }
  #status { grid-column: 2; grid-row: 2; align-self: center; justify-self: center; opacity: 0.6; }
  #status:empty { display: none; }

  /* The painting rooms: the car with the room's camera, or the room's flat maps (a tab), the
     picked part in the panel */
  .shelfHead .grow { flex: 1; }
  .show { display: flex; gap: 5px; align-items: center; align-self: center; }
  .show[hidden] { display: none; }
  .show .say { font: 12px "Segoe UI", system-ui, -apple-system, sans-serif; text-transform: none; letter-spacing: 0; opacity: 0.55; margin-right: 4px; }
  .show .sk { font-size: 17px; padding: 6px 11px 3px; }
  .paintRoom { grid-column: 1 / 3; grid-row: 2; display: grid; grid-template-rows: auto minmax(0, 1fr); padding: 0 0 16px 34px; min-height: 0; }
  /* one line of 44 px, or two when a round's switch leaves the pickers no room */
  .paintHead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; min-height: 44px; padding-left: 4px; min-width: 0; }
  .paintHead h3 { margin: 0; font-size: 34px; font-weight: 600; transform: skewX(-9deg); }
  .paintHead .about { opacity: 0.55; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  #prStage { position: relative; margin-top: 8px; background: var(--ball); overflow: hidden; display: grid; place-items: center; }
  #prCar { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #prCar[hidden], #prMap[hidden] { display: none; }
  #prMap { position: relative; background: var(--ball); cursor: crosshair; touch-action: none; }
  #prMap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #prTag { position: absolute; z-index: 1; pointer-events: none; padding: 5px 10px; font-size: 13px; white-space: nowrap;
           background: rgba(12, 14, 18, 0.85); backdrop-filter: blur(6px); border-radius: 4px; }
  #prLive { position: absolute; left: 14px; top: 12px; z-index: 2; background: rgba(12, 14, 18, 0.75); backdrop-filter: blur(6px); }

  /* The Studio: the car at the picked step, a filmstrip of every step under it. A second car,
     behind the first, draws the filmstrip's pictures. */
  .studio { grid-column: 1 / 3; grid-row: 2; display: grid; grid-template-rows: 44px minmax(0, 1fr) 176px; padding-left: 34px; min-height: 0; }
  .studioHead { display: flex; align-items: center; gap: 16px; padding-left: 4px; }
  .studioHead h3 { margin: 0; font-size: 34px; font-weight: 600; transform: skewX(-9deg); }
  .live { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 12px 5px; background: rgba(255, 255, 255, 0.06); }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.35); }
  .live.on i { background: var(--acc); box-shadow: 0 0 0 3px rgba(232, 255, 71, 0.2); animation: pulse 0.9s ease-in-out infinite alternate; }
  @keyframes pulse { to { box-shadow: 0 0 0 6px rgba(232, 255, 71, 0); } }
  #stStage { position: relative; margin-top: 8px; background: var(--ball); overflow: hidden; }
  #stStage iframe { position: absolute; border: 0; }
  #stCar { inset: 0; width: 100%; height: 100%; }
  #stThumbs { right: 0; bottom: 0; width: 400px; height: 300px; }
  .at { position: absolute; left: 18px; bottom: 14px; font-size: 26px; font-weight: 600; transform: skewX(-9deg); pointer-events: none; }
  .at small { font-size: 18px; opacity: 0.55; font-weight: 500; margin-left: 8px; }
  .strip { display: flex; gap: 8px; padding-top: 10px; overflow-x: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.2) transparent; }
  .still { flex: none; width: 162px; padding: 0 0 6px; background: var(--ball); text-align: left; position: relative; align-self: start; }
  .still img { display: block; width: 162px; height: 122px; object-fit: cover; background: #111316; }
  .still .fn { font-size: 18px; padding: 4px 8px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .still .fn small { font-size: 14px; opacity: 0.6; }
  .still .k { position: absolute; left: 7px; top: 5px; font-size: 16px; opacity: 0.6; }
  .still:hover { background: #111318; }
  .still[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--acc); }
  .still.wip { cursor: default; }
  .still img:not([src]) { visibility: hidden; }  /* painting, or its picture still being drawn */
  .newTag { font-style: normal; display: inline-block; font-size: 13px; padding: 2px 5px 0; margin-left: 4px; background: var(--acc);
            color: var(--ground); transform: skewX(-12deg); vertical-align: 1px; }
  .quote { font-style: italic; }

  /* Narrower windows: the families become a row above the shelf, the picked material below it. */
  @media (max-width: 1000px) {
    body { overflow: auto; }
    #page { display: block; height: auto; }
    #labTop { padding: 14px 16px; flex-wrap: wrap; gap: 10px 16px; }
    #labName { font-size: 44px; }
    #rooms .sk, #labTop .sk { font-size: 17px; padding: 6px 10px 3px; }
    #rooms { max-width: 100%; overflow-x: auto; scrollbar-width: none; padding: 0 4px; box-sizing: border-box; }  /* the rooms scroll, like the families */
    .rail { clip-path: none; background: none; padding: 0 16px; overflow-x: auto; white-space: nowrap; }
    .rail h2 { display: none; }
    #families { display: flex; gap: 4px; }
    .paintRoom { display: block; padding: 0 16px; }
    .paintHead { flex-wrap: wrap; height: auto; padding: 4px 0 6px; }
    #prStage { height: 70vw; }
    .item { width: auto; flex: none; gap: 8px; margin: 0; background: rgba(255, 255, 255, 0.08); }
    .shelf { overflow: visible; padding: 12px 16px 0; }
    .shelfHead { flex-wrap: wrap; }
    #tiles { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
    .spec { margin: 16px 16px 80px; }
    .studio { display: block; padding: 0 16px; }
    .studioHead { flex-wrap: wrap; gap: 8px 16px; padding: 4px 0 6px; }  /* a round's switch goes under the title */
    #stRound, #prRound { flex-wrap: wrap; row-gap: 5px; }  /* and its buttons wrap when their names are long */
    #stStage { height: 62vw; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three/build/three.module.js", "three/addons/": "./lib/three/examples/jsm/" } }
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
</svg>
<div id="page">
  <header id="labTop">
    <h1 id="labName" class="teko">The Lab</h1>
    <nav id="rooms" class="teko">
      <button class="sk" data-room="studio" aria-pressed="true"><span>Studio</span></button>
      <button class="sk" data-room="materials" aria-pressed="false"><span>Materials</span></button>
    </nav>
    <span class="grow"></span>
    <a id="back" class="sk teko" href="./index.html"><svg class="ic"><use href="#i-back"/></svg><span>Back to the viewer</span></a>
  </header>

  <section id="roomStudio" class="room">
    <div class="studio">
      <div class="studioHead"><h3 id="stTitle" class="teko"></h3><div id="stRound" class="show teko" hidden></div><div id="stLive" class="live"><i></i><span id="stLiveText">Loading…</span></div></div>
      <div id="stStage">
        <iframe id="stThumbs" tabindex="-1" aria-hidden="true" title=""></iframe>
        <iframe id="stCar" title="the car at the picked step"></iframe>
        <div id="stAt" class="at teko"></div>
      </div>
      <div id="stStrip" class="strip"></div>
    </div>
    <aside class="spec">
      <h2 id="stName" class="specName teko" style="margin-top: 14px"></h2>
      <div class="row"><span class="lab">What it does</span><span id="stDoes"></span></div>
      <div class="row" id="stWordsRow"><span class="lab">Your words</span><span id="stWords" class="quote"></span></div>
      <div class="row"><span class="lab">Paints</span><span id="stPaints"></span></div>
      <div class="row"><span class="lab">After it</span><span id="stAfter"></span></div>
      <div class="row" id="stClayRow" hidden><span class="lab">Still clay</span><span id="stClay"></span></div>
      <button id="stCopy" class="sk acc teko copyWide"><svg class="ic"><use href="#i-copy"/></svg><span>Copy for Claude</span></button>
      <div id="stLine" class="preview"></div>
    </aside>
  </section>

  <section id="roomMaterials" class="room" hidden>
    <aside id="rail" class="rail teko">
      <h2>Materials <span id="count"></span></h2>
      <div id="families"></div>
    </aside>

    <main id="shelf" class="shelf">
      <div class="shelfHead"><h3 id="familyName" class="teko"></h3><span id="familyCount"></span></div>
      <div id="tiles"></div>
    </main>

    <aside id="spec" class="spec" hidden>
      <canvas id="big" width="440" height="440" title="drag to turn it"></canvas>
      <h2 id="specName" class="specName teko"></h2>
      <div class="meters" id="meters"></div>
      <div class="row"><span class="lab">Colour</span><span id="colour"></span></div>
      <div class="row"><span class="lab">Works on</span><span id="works"></span></div>
      <div class="row"><span class="lab">Numbers</span><span id="source"></span></div>
      <div class="row"><span class="lab">What it is</span><span id="about"></span></div>
      <button id="copy" class="sk acc teko copyWide"><svg class="ic"><use href="#i-copy"/></svg><span>Copy for Claude</span></button>
      <div id="preview" class="preview"></div>
    </aside>
  </section>

  <section id="roomPaint" class="room" hidden>
    <div class="paintRoom">
      <div class="paintHead"><h3 id="prName" class="teko"></h3><div id="prRound" class="show teko" hidden></div><span id="prAbout" class="about"></span>
        <div id="prMaps" class="show teko" hidden></div>
        <div id="prMood" class="show teko" hidden></div>
        <div id="prTabs" class="show teko"></div>
      </div>
      <div id="prStage">
        <iframe id="prCar" title="the car: click a part to pick it"></iframe>
        <div id="prMap" hidden><canvas id="prBase"></canvas><canvas id="prLit"></canvas><div id="prTag" hidden></div></div>
        <div id="prLive" class="live"><i></i><span id="prLiveText">Loading…</span></div>
      </div>
    </div>
    <aside class="spec">
      <h2 id="prPart" class="specName teko" style="margin-top: 14px"></h2>
      <div class="row"><span class="lab">Room</span><span id="prRooms"></span></div>
      <div class="row"><span class="lab">Map</span><span id="prWhere"></span></div>
      <div class="row" id="prSurfaceRow" hidden><span class="lab">Surface</span><span id="prSurface"></span></div>
      <div class="row"><span class="lab">Part of</span><span id="prParent"></span></div>
      <div class="row"><span class="lab">Paint</span><span id="prPaint"></span></div>
      <div class="row"><span class="lab">Sharpness</span><span id="prSharp"></span></div>
      <div class="row"><span class="lab">Size</span><span id="prSize"></span></div>
      <button id="prCopy" class="sk acc teko copyWide"><svg class="ic"><use href="#i-copy"/></svg><span>Copy for Claude</span></button>
      <div id="prLine" class="preview"></div>
    </aside>
  </section>
  <div id="status">Loading…</div>
</div>
<div id="toast" role="status"><b class="teko">Copied</b><span id="toastText"></span></div>
<script type="module" src="./lab.js"></script>
</body>
</html>
