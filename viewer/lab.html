<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lab</title>
<link rel="icon" href="data:,">
<style>
  /* The Lab: the tool's own lists (materials now; the UV map, spots and parts later), each
     thing with a line to copy and paste to Claude. The viewer's look (index.html): Teko,
     slanted buttons, one yellow-green accent. The materials room is layout A of round 2 of the
     mockups the user chose on 2026-09-26 (CHECKLIST.md, "The Lab"). */
  @font-face { font-family: Teko; src: url("lib/fonts/Teko-Variable.ttf") format("truetype"); font-weight: 300 700; font-display: block; }
  :root { --ground: #0d0f12; --text: #f2f4f7; --acc: #e8ff47; --ball: #050506; --rail: 250px; --spec: 340px; }
  html, body { margin: 0; height: 100%; background: var(--ground); }
  body { font: 14px/1.35 "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--text); overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
           text-transform: inherit; letter-spacing: inherit; line-height: inherit; }
  a { color: inherit; }
  .ic { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .teko { font-family: Teko, Bahnschrift, "DIN Condensed", sans-serif; text-transform: uppercase; letter-spacing: 0.03em; line-height: 1; }
  .sk { display: flex; align-items: center; gap: 7px; padding: 8px 14px 5px; font-size: 20px; background: rgba(255, 255, 255, 0.08);
        transform: skewX(-12deg); transition: background 0.12s, color 0.12s; white-space: nowrap; text-decoration: none; }
  .sk > * { transform: skewX(12deg); }
  .sk .ic { font-size: 16px; margin-top: -3px; }
  .sk:hover { background: rgba(255, 255, 255, 0.16); }
  .sk[aria-pressed="true"] { background: var(--text); color: var(--ground); }
  .sk[aria-disabled="true"] { opacity: 0.35; cursor: default; }
  .sk[aria-disabled="true"]:hover { background: rgba(255, 255, 255, 0.08); }
  .sk.acc { background: var(--acc); color: var(--ground); font-weight: 600; }
  .sk.acc:hover { background: #f1ff8a; }

  #page { display: grid; grid-template-columns: var(--rail) 1fr var(--spec); grid-template-rows: 92px 1fr; height: 100%; column-gap: 8px; }

  /* The Lab's name and its rooms */
  #labTop { grid-column: 1 / -1; display: flex; align-items: center; gap: 26px; padding: 0 40px 0 34px; }
  #labName { margin: 0; font-size: 54px; font-weight: 600; transform: skewX(-9deg); padding-top: 8px; }
  #rooms { display: flex; gap: 6px; }
  #labTop .grow { flex: 1; }

  /* The families */
  #rail { padding: 14px 44px 0 24px; background: rgba(8, 9, 12, 0.9); clip-path: polygon(0 0, 100% 0, calc(100% - 30px) 100%, 0 100%);
          overflow-y: auto; scrollbar-width: none; }
  #rail h2 { margin: 0 0 12px 6px; font-size: 28px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
  #rail h2 span { font-size: 20px; opacity: 0.5; font-weight: 400; }
  .item { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; padding: 6px 10px 3px;
          margin-bottom: 3px; transform: skewX(-10deg); }
  .item > * { transform: skewX(10deg); }
  .item .n { font-size: 21px; font-weight: 500; }
  .item .cnt { font-size: 17px; opacity: 0.5; }
  .item:hover { background: rgba(255, 255, 255, 0.07); }
  .item[aria-current="true"] { background: rgba(232, 255, 71, 0.13); box-shadow: inset 4px 0 var(--acc); }

  /* The shelf: the open family's balls */
  #shelf { overflow-y: auto; padding: 4px 4px 70px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.2) transparent; }
  #shelfHead { display: flex; align-items: baseline; gap: 12px; margin: 4px 0 10px 4px; }
  #shelfHead h3 { margin: 0; font-size: 34px; font-weight: 600; transform: skewX(-9deg); }
  #shelfHead span { opacity: 0.55; font-size: 13px; }
  #tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
  .tile { position: relative; display: flex; flex-direction: column; text-align: left; padding: 0 0 7px; background: var(--ball); cursor: pointer; }
  .tile:hover { background: #111318; }
  .tile[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--acc); }
  .tile .pic { width: 100%; aspect-ratio: 1; display: block; background: var(--ball); }
  .tile .code { position: absolute; left: 7px; top: 6px; font-size: 16px; opacity: 0.55; }
  .tile .tn { font-size: 18px; padding: 3px 8px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .tv { font-size: 11px; opacity: 0.55; padding: 1px 6px 0; white-space: nowrap; }
  .tile em { font-style: normal; display: inline-block; font-size: 13px; padding: 2px 5px 0; margin-left: 3px; background: var(--acc);
             color: var(--ground); transform: skewX(-12deg); vertical-align: 1px; }
  .tile .code:has(em) { opacity: 1; color: rgba(242, 244, 247, 0.55); }
  .copyBtn { position: absolute; right: 5px; top: 5px; width: 28px; height: 28px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.1); }
  .copyBtn:hover { background: rgba(255, 255, 255, 0.22); }
  .copyBtn .ic { font-size: 15px; }
  .copyBtn.done { background: var(--acc); color: var(--ground); }

  /* The picked material */
  #spec { margin: 4px 40px 16px 0; padding: 0 16px 14px; background: var(--ball); overflow-y: auto; scrollbar-width: none; }
  #big { display: block; width: 220px; height: 220px; margin: 0 auto -4px; cursor: grab; touch-action: none; }
  #specName { margin: 0 0 6px; font-size: 44px; font-weight: 600; transform: skewX(-9deg); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  #specName small { font-size: 22px; opacity: 0.55; font-weight: 500; }
  .meters { display: flex; flex-direction: column; gap: 7px; margin: 4px 0 10px; }
  .mk { display: flex; justify-content: space-between; font-size: 20px; margin-bottom: 4px; }
  .mk b { font-weight: 500; font-variant-numeric: tabular-nums; }
  .track { display: block; height: 6px; background: rgba(255, 255, 255, 0.12); }
  .track i { display: block; height: 100%; background: var(--text); }
  .row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-top: 1px solid rgba(255, 255, 255, 0.08); font-size: 13px; }
  .row .lab { opacity: 0.55; width: 72px; flex: none; font-size: 12px; padding-top: 1px; }
  .chip { display: inline-block; width: 14px; height: 14px; border-radius: 2px; margin-right: 6px; vertical-align: -2px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2); }
  #about { font-size: 12.5px; opacity: 0.7; }
  #copy { width: 100%; justify-content: center; font-size: 22px; padding: 10px 14px 7px; margin-top: 12px; box-sizing: border-box; }
  #copy .ic { font-size: 17px; }
  #preview { margin-top: 8px; padding: 8px 10px; background: rgba(255, 255, 255, 0.06); font-size: 12.5px; line-height: 1.45;
             color: rgba(242, 244, 247, 0.85); user-select: all; }

  #toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; z-index: 5;
           display: flex; align-items: baseline; gap: 10px; max-width: calc(100vw - 32px); box-sizing: border-box;
           background: rgba(12, 14, 18, 0.94); backdrop-filter: blur(6px); padding: 9px 16px 8px; box-shadow: inset 4px 0 var(--acc);
           font-size: 13.5px; transition: opacity 0.15s, transform 0.15s; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #toast b { font-size: 20px; font-weight: 600; color: var(--acc); }
  #status { grid-column: 2; align-self: center; justify-self: center; opacity: 0.6; }
  #status:empty { display: none; }

  /* Narrower windows: the families become a row above the shelf, the picked material below it. */
  @media (max-width: 1000px) {
    body { overflow: auto; }
    #page { display: block; height: auto; }
    #labTop { padding: 14px 16px; flex-wrap: wrap; gap: 10px 16px; }
    #labName { font-size: 44px; }
    #rooms .sk, #labTop .sk { font-size: 17px; padding: 6px 10px 3px; }
    #rail { clip-path: none; background: none; padding: 0 16px; overflow-x: auto; white-space: nowrap; }
    #rail h2 { display: none; }
    #families { display: flex; gap: 4px; }
    .item { width: auto; flex: none; gap: 8px; margin: 0; background: rgba(255, 255, 255, 0.08); }
    #shelf { overflow: visible; padding: 12px 16px 0; }
    #tiles { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
    #spec { margin: 16px 16px 80px; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three/build/three.module.js", "three/addons/": "./lib/three/examples/jsm/" } }
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
</svg>
<div id="page">
  <header id="labTop">
    <h1 id="labName" class="teko">The Lab</h1>
    <nav id="rooms" class="teko">
      <button class="sk" aria-pressed="true"><span>Materials</span></button>
      <button class="sk" aria-pressed="false" aria-disabled="true" title="a later step"><span>UV map</span></button>
      <button class="sk" aria-pressed="false" aria-disabled="true" title="a later step"><span>Spots</span></button>
      <button class="sk" aria-pressed="false" aria-disabled="true" title="a later step"><span>Parts</span></button>
    </nav>
    <span class="grow"></span>
    <a id="back" class="sk teko" href="./index.html"><svg class="ic"><use href="#i-back"/></svg><span>Back to the viewer</span></a>
  </header>

  <aside id="rail" class="teko">
    <h2>Materials <span id="count"></span></h2>
    <div id="families"></div>
  </aside>

  <main id="shelf">
    <div id="shelfHead"><h3 id="familyName" class="teko"></h3><span id="familyCount"></span></div>
    <div id="tiles"></div>
  </main>

  <aside id="spec" hidden>
    <canvas id="big" width="440" height="440" title="drag to turn it"></canvas>
    <h2 id="specName" class="teko"></h2>
    <div class="meters" id="meters"></div>
    <div class="row"><span class="lab">Colour</span><span id="colour"></span></div>
    <div class="row"><span class="lab">Works on</span><span id="works"></span></div>
    <div class="row"><span class="lab">Numbers</span><span id="source"></span></div>
    <div class="row"><span class="lab">What it is</span><span id="about"></span></div>
    <button id="copy" class="sk acc teko"><svg class="ic"><use href="#i-copy"/></svg><span>Copy for Claude</span></button>
    <div id="preview"></div>
  </aside>
  <div id="status">Loading…</div>
</div>
<div id="toast" role="status"><b class="teko">Copied</b><span id="toastText"></span></div>
<script type="module" src="./lab.js"></script>
</body>
</html>
