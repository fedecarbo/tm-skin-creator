<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mood</title>
<link rel="icon" href="data:,">
<style>
  /* A studio car's mood boards side by side (tool/mood.py writes data/mood/<car>/boards.json): each
     a colour story, the finishes on the Lab's balls (balls.js) and a wall of drawings and pictures.
     The Lab's look: Teko, slanted shapes, one yellow-green accent. The user picks in the chat. */
  @font-face { font-family: Teko; src: url("lib/fonts/Teko-Variable.ttf") format("truetype"); font-weight: 300 700; font-display: block; }
  :root { --ground: #0d0f12; --card: #15181d; --text: #f2f4f7; --muted: rgba(242, 244, 247, 0.58); --acc: #e8ff47; --ball: #050506; }
  html, body { margin: 0; background: var(--ground); }
  body { font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--text); }
  .teko { font-family: Teko, Bahnschrift, "DIN Condensed", sans-serif; text-transform: uppercase; letter-spacing: 0.03em; line-height: 1; }

  header { padding: 26px 34px 6px; max-width: 1100px; }
  .kicker { font-size: 20px; color: var(--muted); }
  h1 { margin: 4px 0 10px; font-size: 56px; font-weight: 600; transform: skewX(-9deg); transform-origin: left bottom; }
  .brief { margin: 0 0 8px; font-size: 16px; max-width: 70ch; }
  .ask { margin: 0; color: var(--muted); }
  #status { padding: 0 34px; color: var(--muted); }

  #boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 20px; padding: 18px 34px 44px; }
  .board { background: var(--card); padding-bottom: 20px; min-width: 0; }
  .story { display: flex; height: 16px; }
  .story i { display: block; }
  .head { display: flex; gap: 14px; align-items: flex-start; padding: 18px 20px 4px; }
  .key { flex: none; background: var(--acc); color: var(--ground); font-size: 34px; font-weight: 600; padding: 8px 12px 2px;
         transform: skewX(-12deg); }
  .key span { display: inline-block; transform: skewX(12deg); }
  .title { margin: 2px 0 6px; font-size: 38px; font-weight: 600; }
  .line { margin: 0; color: var(--muted); }
  h3 { margin: 18px 20px 8px; font-size: 20px; font-weight: 500; color: var(--muted); }

  .wall { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 20px 0; }
  .wall figure { margin: 0; min-width: 0; }
  .wall figure.wide { grid-column: span 2; }
  .wall .pic { aspect-ratio: 1; background: #0a0b0d; overflow: hidden; }
  .wall .wide .pic { aspect-ratio: 2 / 0.97; }
  .wall .pic svg, .wall .pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
  figcaption { font-size: 12px; color: var(--muted); padding-top: 5px; }

  .finishes { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; padding: 0 20px; }
  .finish img { display: block; width: 100%; aspect-ratio: 1; background: var(--ball); }
  .finish b { display: block; font-size: 17px; font-weight: 500; margin-top: 6px; }
  .finish small { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }

  .chips { display: grid; gap: 6px; padding: 0 20px; }
  .chip { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; }
  .chip i { width: 30px; height: 30px; display: block; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12); }
  .chip .n { font-size: 15px; }
  .chip .r { color: var(--muted); font-size: 12px; }
  .chip code { color: var(--muted); font-size: 12px; }

  @media (max-width: 560px) {
    header { padding: 20px 16px 4px; }
    h1 { font-size: 44px; }
    #boards { padding: 14px 16px 32px; }
    .wall { grid-template-columns: repeat(2, 1fr); }
  }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three/build/three.module.js", "three/addons/": "./lib/three/examples/jsm/" } }
</script>
</head>
<body>
<header>
  <div class="kicker teko">The studio · Mood</div>
  <h1 class="teko" id="car"></h1>
  <p class="brief" id="brief"></p>
  <p class="ask" id="ask"></p>
</header>
<p id="status">Loading…</p>
<main id="boards"></main>
<script type="module">
import { THUMB, daySky, dress, shape, stage, textures } from './balls.js';

const car = new URLSearchParams(location.search).get('car');
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => Object.assign(document.createElement(tag), cls ? { className: cls } : {}, text != null ? { textContent: text } : {});
window.mood = { ready: false, error: null };

const shelf = stage(document.createElement('canvas'), THUMB);
async function ballPicture(m) {  // one ball at a time, as the Lab's shelf does
  const tex = await textures(m, m.base);
  shape(shelf, 'ball');
  dress(shelf.ball, m, tex);
  shelf.renderer.render(shelf.scene, shelf.camera);
  const blob = await new Promise((r) => shelf.renderer.domElement.toBlob(r, 'image/png'));
  Object.values(tex).forEach((t) => t && t.dispose());
  return URL.createObjectURL(blob);
}

function board(b, pending) {
  const box = el('section', 'board');
  const story = el('div', 'story');
  const total = b.colours.reduce((s, c) => s + (c.share || 0), 0) || b.colours.length;
  for (const c of b.colours) {
    const i = el('i');
    i.style.cssText = `background:${c.hex};flex:${(c.share || total / b.colours.length) / total}`;
    story.append(i);
  }
  box.append(story);
  const head = el('div', 'head');
  const key = el('div', 'key teko');
  key.append(el('span', null, b.key));
  const words = el('div');
  words.append(el('h2', 'title teko', b.title), el('p', 'line', b.line));
  head.append(key, words);
  box.append(head);

  if (b.wall.length) {
    const wall = el('div', 'wall');
    for (const w of b.wall) {
      const fig = el('figure', w.wide ? 'wide' : '');
      const pic = el('div', 'pic');
      // a drawing as a picture of its own, so its ids (gradients, filters) can't clash with another's
      const src = w.svg ? `data:image/svg+xml;charset=utf-8,${encodeURIComponent(w.svg)}` : w.picture;
      pic.append(Object.assign(el('img'), { src, alt: w.caption }));
      fig.append(pic);
      if (w.caption) fig.append(el('figcaption', null, w.caption));
      wall.append(fig);
    }
    box.append(wall);
  }
  if (b.finishes.length) {
    box.append(el('h3', 'teko', 'Finishes'));
    const row = el('div', 'finishes');
    for (const m of b.finishes) {
      const f = el('div', 'finish');
      const img = Object.assign(el('img'), { alt: m.label });
      f.append(img, el('b', 'teko', m.label), el('small', null, m.line));
      row.append(f);
      pending.push([img, m]);
    }
    box.append(row);
  }
  if (b.colours.length) {
    box.append(el('h3', 'teko', 'Colours'));
    const chips = el('div', 'chips');
    for (const c of b.colours) {
      const row = el('div', 'chip');
      const sw = el('i');
      sw.style.background = c.hex;
      const n = el('div');
      n.append(el('div', 'n', c.name), el('div', 'r', c.role + (c.share ? ` · ${Math.round(c.share)}%` : '')));
      row.append(sw, n, el('code', null, c.hex));
      chips.append(row);
    }
    box.append(chips);
  }
  return box;
}

async function start() {
  if (!car) throw new Error('Which car? mood.html?car=<name>');
  const res = await fetch(`data/mood/${encodeURIComponent(car)}/boards.json`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`No boards for ${car} yet: python -m tool.mood ${car}`);
  const doc = await res.json();
  document.title = `Mood · ${doc.title}`;
  $('car').textContent = doc.title;
  $('brief').textContent = doc.brief;
  const keys = doc.boards.map((b) => b.key);
  $('ask').textContent = `Pick one in the chat (${keys.slice(0, -1).join(', ')} or ${keys.at(-1)}), or say what to take from each.`;
  const pending = [];
  for (const b of doc.boards) $('boards').append(board(b, pending));
  $('status').textContent = '';
  await daySky([shelf]);
  for (const [img, m] of pending) img.src = await ballPicture(m);
  window.mood.ready = true;
}
start().catch((e) => {
  window.mood.error = String(e && e.stack || e);
  $('status').textContent = String(e && e.message || e);
});
</script>
</body>
</html>
