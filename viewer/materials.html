<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materials</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; background: #0d0f12; }
  body { font: 15px/1.4 "Segoe UI", system-ui, sans-serif; color: #f2f4f7; padding: 24px 16px 48px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 16px; font-weight: 600; margin: 28px 0 10px; opacity: 0.85; text-transform: capitalize; }
  .sub { opacity: 0.6; margin-bottom: 8px; font-size: 13px; max-width: 900px; }
  .sub a { color: inherit; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; max-width: 1500px; }
  a.card { display: block; background: #171a1f; border-radius: 12px; overflow: hidden; color: inherit; text-decoration: none;
           border: 1px solid rgba(255, 255, 255, 0.08); transition: transform 0.12s, border-color 0.12s; }
  a.card:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.3); }
  .pic { aspect-ratio: 1; background: #2a2b2e center / cover no-repeat; }
  .body { padding: 8px 10px 10px; }
  .name { font-weight: 600; font-size: 14px; }
  .about { opacity: 0.65; font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>
<h1>Materials</h1>
<div class="sub">Every finish the tool knows, on a ball lit like the car in the viewer. Say the name, add a colour
("dark red carbon", "matte gold", "rusted cream"), and it goes on any part. Click a ball to spin it.
Back to <a href="./gallery.html">your skins</a>.</div>
<div id="groups"></div>
<script>
(async () => {
  const res = await fetch('data/materials/materials.json', { cache: 'no-store' });
  const items = res.ok ? await res.json() : [];
  const groups = new Map();
  for (const m of items) {
    if (!groups.has(m.family)) groups.set(m.family, []);
    groups.get(m.family).push(m);
  }
  const root = document.getElementById('groups');
  for (const [family, list] of groups) {
    const h = document.createElement('h2');
    h.textContent = family;
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const m of list) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = `./swatch.html?m=${encodeURIComponent(m.slug)}`;
      const pic = document.createElement('div');
      pic.className = 'pic';
      pic.style.backgroundImage = `url("data/materials/${m.slug}/swatch.png?t=${m.stamp}")`;
      const body = document.createElement('div');
      body.className = 'body';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = m.name;
      const about = document.createElement('div');
      about.className = 'about';
      about.textContent = m.about || '';
      body.append(name, about);
      a.append(pic, body);
      grid.append(a);
    }
    root.append(h, grid);
  }
})();
</script>
</body>
</html>
