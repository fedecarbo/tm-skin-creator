<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The car</title>
<link rel="icon" href="data:,">
<style>
  /* The camera's own page: the car in its studio (viewer.js) and nothing else; `PY -m tool.view <name>` opens it,
     Claude's snapshots and close looks photograph it (?snap=1), a concept's page frames it (?embed=1). A concept's
     own page is its own HTML over the same engine, imported from /camera/viewer.js (tool/server.py). */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f12; }
  body { font: 14px/1.35 "Segoe UI", system-ui, -apple-system, sans-serif; color: #f2f4f7; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  a { color: inherit; }
  #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 15px; padding: 10px 12px;
            background: rgba(12, 14, 18, 0.78); backdrop-filter: blur(6px); border-radius: 4px; }
  #status:empty { display: none; }
  /* the car model's and the skies' credit (CC BY 4.0 asks for it wherever the car is shown); not on a snapshot or in a
     frame of a page, which carries its own (body.bare: viewer.js) */
  #credit { position: fixed; left: 0; right: 0; bottom: 6px; padding: 0 16px; text-align: center; font-size: 10.5px; opacity: 0.45; }
  body.bare #credit { display: none; }
</style>
<!-- three.js 0.186.1 (r186, the latest on 2026-10-01), copied from the npm package (jsdelivr) into lib/three, with its licence. -->
<script type="importmap">
{ "imports": { "three": "./lib/three/build/three.module.js", "three/addons/": "./lib/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="credit">
  Car model: <a href="https://sketchfab.com/3d-models/trackmania-2020-carsport-c8b80bfc1ed1427eb37f3eba8d1ecfbf">Trackmania 2020 CarSport</a>
  by <a href="https://sketchfab.com/amogusstrikesback2">amogusstrikesback2</a>,
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.
  Lighting: <a href="https://polyhaven.com/a/kloofendal_48d_partly_cloudy_puresky">Kloofendal 48d Partly Cloudy (Pure Sky)</a>,
  <a href="https://polyhaven.com/a/belfast_sunset_puresky">Belfast Sunset (Pure Sky)</a>,
  <a href="https://polyhaven.com/a/qwantani_dusk_2_puresky">Qwantani Dusk 2 (Pure Sky)</a> and
  <a href="https://polyhaven.com/a/dikhololo_night">Dikhololo Night</a> from Poly Haven, CC0.
</div>
<div id="status">Loading…</div>
<script type="module">
  import './viewer.js';
  // the bare page's one thing of its own: the skin the address names goes on the car once it's up (a snapshot, ?snap=1,
  // puts it on before its first frame; a page over the engine dresses the car itself)
  const name = new URLSearchParams(location.search).get('skin');
  if (name && !new URLSearchParams(location.search).has('snap')) viewer.on('ready', () => viewer.load(name).catch(console.error));
</script>
</body>
</html>
