<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Skin Lab</title>
<link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #111214; color: #ddd; font: 13px -apple-system, system-ui, sans-serif; overflow: hidden; }
  #bar { height: 38px; -webkit-app-region: drag; display: flex; align-items: center; justify-content: center; color: #888; font-size: 12px; letter-spacing: .02em; user-select: none; }
  #split { position: absolute; top: 38px; left: 0; right: 0; bottom: 0; display: flex; }
  #left { flex: 0 0 58%; position: relative; background: #0d0e10; }
  #left iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #0d0e10; }
  #waiting { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #777; }
  #divider { flex: 0 0 6px; cursor: col-resize; background: #1b1c1f; }
  #divider:hover, #divider.on { background: #2d6cdf; }
  #right { flex: 1 1 auto; min-width: 360px; background: #111214; padding: 8px 4px 8px 10px; box-sizing: border-box; }
  #term { width: 100%; height: 100%; }
  .xterm .xterm-viewport { background: transparent !important; }
  #shade { position: absolute; inset: 0; display: none; }  /* over the iframe while dragging the divider */
</style>
</head>
<body>
<div id="bar">Skin Lab</div>
<div id="split">
  <div id="left"><div id="waiting">Starting the Lab…</div><div id="shade"></div></div>
  <div id="divider"></div>
  <div id="right"><div id="term"></div></div>
</div>
<script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="renderer.js"></script>
</body>
</html>
